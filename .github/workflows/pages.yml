name: Deploy to GitHub Pages

# Pushes to the default branch publish the site. Other branches build nothing,
# so a work-in-progress never deploys over a working page.
#
# This used to fail on every push with
#
#   Get Pages site failed. Please verify that the repository has Pages enabled
#
# which is what the failure e-mails were. The cause was Pages being off for the
# repository, not the workflow; `enablement: true` on configure-pages below
# fixes it at the source by turning Pages on during the first run.
#
# Why it has to be the built output and not the repository: the root
# `index.html` is Vite's development entry, whose only script tag points at
# `/src/main.ts`, and no browser can execute TypeScript. Served as-is -- which
# is what "Deploy from a branch" does -- the page loads, `#root` stays empty,
# and the dark colour-scheme leaves a blank grey screen with no error to go on.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait rather than cancel, so a push that
# lands mid-deploy still reaches the site instead of being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Manual runs always go ahead; automatic ones only from the default branch.
    # `on: push:` cannot express that itself, because the branch filter there is
    # a literal list and the default branch's name is only known at run time.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # `enablement: true` turns Pages on for the repository if it is not on
      # already, rather than failing with "Get Pages site failed".
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pages serves a project site from /<repo>/, so the bundle's asset URLs
      # have to carry that prefix or every one of them 404s and the page comes
      # up blank. Take it from the base path configure-pages just reported
      # rather than hard-coding the repository name, so a rename, a move to an
      # organisation, or a custom domain served from the root all keep working.
      #
      # That value is "/<repo>" for a project site and "/" for a root-served
      # one; `vite.config.ts` wants a trailing slash in both cases. Fall back to
      # the repository name if the output is ever missing.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${BASE_PATH:-/${GITHUB_REPOSITORY#*/}}"
          export VITE_BASE="${base%/}/"
          echo "Building with base $VITE_BASE"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
