name: Deploy to GitHub Pages

# This repository is now a forwarding page: the game it used to hold lives in
# Triplanetary-VTT, under `src/ogre/`. So there is nothing to build — the site
# is the `index.html` in this repository, served as it is.
#
# Which is why this no longer runs `npm ci` and `vite build`. The old comment
# here explained that the repository root could not be served directly, because
# the root `index.html` was Vite's development entry and pointed at
# `/src/main.ts`, which no browser can execute. That is no longer true: there is
# no `src/`, and the root page is a complete, plain HTML document.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait rather than cancel, so a push that
# lands mid-deploy still reaches the site instead of being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs always go ahead; automatic ones only from the default branch.
    # `on: push:` cannot express that itself, because the branch filter there is
    # a literal list and the default branch's name is only known at run time.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # `enablement: true` turns Pages on for the repository if it is not on
      # already, rather than failing with "Get Pages site failed".
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The page and the two files it needs: the favicon it links, and
      # `.nojekyll`, without which GitHub Pages would run the site through
      # Jekyll and drop anything beginning with an underscore.
      - name: Assemble the site
        run: |
          mkdir -p _site/public
          cp index.html _site/
          cp public/favicon.svg public/.nojekyll _site/public/
          cp public/.nojekyll _site/
          echo "Publishing the forwarding page:"
          ls -R _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
