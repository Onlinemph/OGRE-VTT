name: Deploy to GitHub Pages

# Publishing is **opt-in**: this workflow only does anything when you ask for
# it, or once Pages has been switched on for the repository.
#
# It used to run on every push, and failed every time with
#
#   Get Pages site failed. Please verify that the repository has Pages enabled
#
# because Pages was not enabled yet -- one failure e-mail per push, for a site
# nobody had asked to publish. `vars.PUBLISH_PAGES` is the switch: set that
# repository variable to `true` (Settings -> Secrets and variables -> Actions ->
# Variables) and pushes to the default branch publish from then on. Until then,
# run it by hand from the Actions tab whenever you want to deploy.
#
# `enablement: true` on configure-pages below means the first run turns Pages on
# by itself, so there is no separate settings step to forget.
#
# Why it has to be the built output and not the repository: the root
# `index.html` is Vite's development entry, whose only script tag points at
# `/src/main.ts`, and no browser can execute TypeScript. Served as-is -- which
# is what "Deploy from a branch" does -- the page loads, `#root` stays empty,
# and the dark colour-scheme leaves a blank grey screen with no error to go on.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait rather than cancel, so a push that
# lands mid-deploy still reaches the site instead of being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Manual runs always go ahead. Automatic ones need both the opt-in variable
    # and the default branch, so a feature branch never deploys over the site.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.PUBLISH_PAGES == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # `enablement: true` turns Pages on for the repository if it is not on
      # already, rather than failing with "Get Pages site failed".
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pages serves the site from /<repo>/, so the bundle's asset URLs have to
      # be built with that prefix. `vite.config.ts` reads VITE_BASE for exactly
      # this reason; a root-served host builds with the default '/'.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /OGRE-VTT/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
